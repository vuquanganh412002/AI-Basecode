<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preconnect for faster font fetch. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts loaded inside `layer(fonts)`. Browser processes this
         <style> block at runtime (not through lightningcss/vite), so the
         remote @import url() statements survive. The `layer(fonts)` keeps
         CDN rules like `.material-icons { font-size: 24px }` at lower
         priority than Tailwind's `layer(utilities)`, so utility classes
         (e.g. `text-[18px]`) reliably override default icon sizing. -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap') layer(fonts);
      @import url('https://fonts.googleapis.com/icon?family=Material+Icons') layer(fonts);
      @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap') layer(fonts);
    </style>
    <title>agrinews</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
