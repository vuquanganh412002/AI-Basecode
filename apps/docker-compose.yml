services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # JST 運用 — see .claude/rules/nestjs.md §Timestamp policy.
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Shared backend definition — both backend instances build the same
  # image and mount the same source. Only container_name + published
  # host port differ (overridden per service below).
  backend: &backend-base
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: agrinews-backend-1
    volumes:
      - ./backend/src:/app/src
      - ./backend/test:/app/test
      - ./backend/scripts:/app/scripts
      - ./backend/jest.config.ts:/app/jest.config.ts
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/package.json:/app/package.json
      - ./docker/certs:/app/certs:ro
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - STORAGE_ENDPOINT=http://minio:9000
      - MAIL_HOST=mailhog
      # JST 運用 — `new Date()` / dayjs / log timestamps render JST. Postgres
      # session timezone is set per-connection via TypeORM `extra.options`
      # in src/database/database.module.ts.
      - TZ=Asia/Tokyo
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Second backend instance — load-balanced behind nginx (upstream
  # backend_pool in docker/nginx/nginx-ssl.conf). `<<: *backend-base`
  # inherits all of backend's config; we override only the bits that
  # must be unique per container. Published on host 3001 so both stay
  # directly reachable for dev; nginx talks to it over the compose
  # network as backend-2:3000.
  backend-2:
    <<: *backend-base
    container_name: agrinews-backend-2
    ports:
      - "3001:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    volumes:
      # Full source sync — src, configs, public, index.html, etc.
      - ./frontend:/app
      # Anonymous volume preserves image's node_modules (prevents host override).
      - /app/node_modules
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"

  nginx:
    build:
      context: ./docker/nginx
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
      - ./docker/nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - backend-2
      - frontend

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 $${STORAGE_ACCESS_KEY} $${STORAGE_SECRET_KEY} && mc mb --ignore-existing local/$${STORAGE_BUCKET}"
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-agrinews}-network
