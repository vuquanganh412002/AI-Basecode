services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # JST 運用 — see .claude/rules/nestjs.md §Timestamp policy.
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 電子版（顧客システム）MySQL のローカル擬似 DB。dokusya-sync バッチが読み取る
  # users / ja テーブルを再現する（本番は DENSHIBAN_DB_* の read-only cmsDB）。
  denshiban-mysql:
    image: mysql:8.0
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DENSHIBAN_DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DENSHIBAN_DB_NAME:-cmsDB}
      MYSQL_USER: ${DENSHIBAN_DB_USERNAME:-readermanage}
      MYSQL_PASSWORD: ${DENSHIBAN_DB_PASSWORD:-readermanage}
      TZ: Asia/Tokyo
    volumes:
      - denshiban_mysql_data:/var/lib/mysql
      - ./docker/denshiban-mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DENSHIBAN_DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    volumes:
      - ./backend/src:/app/src
      - ./backend/test:/app/test
      - ./backend/scripts:/app/scripts
      - ./backend/jest.config.ts:/app/jest.config.ts
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/package.json:/app/package.json
      - ./docker/certs:/app/certs:ro
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - STORAGE_ENDPOINT=http://minio:9000
      - MAIL_HOST=mailhog
      # 電子版 DB はローカルの denshiban-mysql コンテナへ（docker network 内）。
      - DENSHIBAN_DB_HOST=denshiban-mysql
      - DENSHIBAN_DB_PORT=3306
      # JST 運用 — `new Date()` / dayjs / log timestamps render JST. Postgres
      # session timezone is set per-connection via TypeORM `extra.options`
      # in src/database/database.module.ts.
      - TZ=Asia/Tokyo
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      denshiban-mysql:
        condition: service_healthy

  # 定期バッチ。本番は EventBridge → ECS RunTask（agrinews-terraform の
  # envs/<env>/scheduled-batches.tf）。ローカルは backend と同じイメージで
  # busybox crond を回すだけ — docker socket も別イメージも要らない。
  # スケジュールと注意点は docker/backend/batch-crontab を参照。
  batch-scheduler:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    volumes:
      # backend と同じ bind mount。src を直接読むので ts-node で動く。
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/package.json:/app/package.json
      - ./docker/certs:/app/certs:ro
      - ./docker/backend/batch-crontab:/etc/crontabs/root:ro
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - STORAGE_ENDPOINT=http://minio:9000
      - MAIL_HOST=mailhog
      - DENSHIBAN_DB_HOST=denshiban-mysql
      - DENSHIBAN_DB_PORT=3306
      # crontab の時刻を JST として解釈させる（本番 EventBridge は UTC 固定）。
      - TZ=Asia/Tokyo
      # .env は開発者が全件同期を試すため true にしていることがある。10分毎に
      # 23,000 行を舐め直すとローカルが張り付くので、ここでは必ず差分同期。
      # 本番も watermark ベースの差分。
      - DENSHIBAN_FULL_SYNC=false
    env_file:
      - ./backend/.env
    # -f: フォアグラウンド（コンテナが即終了しない）
    # -l 2: 実行したコマンドを stdout に出す → docker compose logs で追える
    command: ["crond", "-f", "-l", "2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      denshiban-mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    volumes:
      # Full source sync — src, configs, public, index.html, etc.
      - ./frontend:/app
      # Anonymous volume preserves image's node_modules (prevents host override).
      - /app/node_modules
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"

  nginx:
    build:
      context: ./docker/nginx
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
      - ./docker/nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 $${STORAGE_ACCESS_KEY} $${STORAGE_SECRET_KEY} && mc mb --ignore-existing local/$${STORAGE_BUCKET}"
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}

volumes:
  postgres_data:
  minio_data:
  redis_data:
  denshiban_mysql_data:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-agrinews}-network
