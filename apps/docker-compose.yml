services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    volumes:
      - ./backend/src:/app/src
      - ./docker/certs:/app/certs:ro
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - STORAGE_ENDPOINT=http://minio:9000
      - MAIL_HOST=mailhog
    env_file:
      - ./backend/.env.development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    volumes:
      # Full source sync — src, configs, public, index.html, etc.
      - ./frontend:/app
      # Anonymous volume preserves image's node_modules (prevents host override).
      - /app/node_modules
    env_file:
      - ./frontend/.env.development
    ports:
      - "5173:5173"

  nginx:
    build:
      context: ./docker/nginx
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
      - ./docker/nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 $${STORAGE_ACCESS_KEY} $${STORAGE_SECRET_KEY} && mc mb --ignore-existing local/$${STORAGE_BUCKET}"
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}

  # Isolated test database — port 5433, never shares data with dev DB
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agrinews_test
      POSTGRES_USER: agrinews_test
      POSTGRES_PASSWORD: agrinews_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrinews_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - test

  # Isolated test Redis — port 6380, no persistence
  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - test

  # Playwright automation test runner — independent black-box testing
  # Tests connect to the running app via https://nginx (UI) and https://nginx/api/v1 (API)
  # Report UI available at http://localhost:9323 after running: npm run report:serve
  playwright:
    build:
      context: ./autotest-agri
      dockerfile: ../docker/playwright/Dockerfile
    working_dir: /autotest
    volumes:
      - ./autotest-agri:/autotest
      # Anonymous volume: preserve node_modules built into the image (not on host)
      - /autotest/node_modules
    ports:
      - "9323:9323"   # Playwright HTML report server
    environment:
      - BASE_URL=https://nginx
      - API_BASE_URL=https://nginx/api/v1
      - CI=true
      - PLAYWRIGHT_TIMEOUT=30000
    depends_on:
      - nginx
    profiles:
      - test

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-agrinews}-network
