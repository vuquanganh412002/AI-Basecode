# Docker's embedded DNS resolver. Required so that `set $upstream <host>;
# proxy_pass $upstream` re-resolves the upstream service hostname every
# `valid` interval — without it, nginx caches the upstream IP at startup
# and returns 502 when a container is recreated and gets a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name agrinews.jp *.agrinews.jp;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name agrinews.jp *.agrinews.jp;

    ssl_certificate     /etc/nginx/certs/agrinews.jp.pem;
    ssl_certificate_key /etc/nginx/certs/agrinews.jp-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # SCR-023 ファイルアップロード画面 accepts up to 30 MB per file
    # (機能定義 4.2). 35 MB gives headroom for multipart envelope +
    # multiple files in one request. Without this nginx rejects with
    # 413 before the upstream sees the request.
    client_max_body_size 35m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location /api {
        # Variable form forces nginx to re-resolve `backend` via Docker's
        # embedded DNS (see `resolver` above). proxy_pass with a literal
        # `http://backend:3000` would resolve once at config load and pin
        # the IP forever — that's the bug behind 502 after container restarts.
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    location /health {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
