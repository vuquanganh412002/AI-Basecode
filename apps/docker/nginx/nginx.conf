# Docker's embedded DNS resolver. Required so `set $upstream <host>;
# proxy_pass $upstream` re-resolves on every request and survives
# container recreation (which assigns a new IP to the upstream).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name agrinews.jp *.agrinews.jp localhost;

    # SCR-023 ファイルアップロード画面 — 30MB per file, 35MB headroom for
    # multipart envelope. Without this nginx 413s before upstream is hit.
    client_max_body_size 35m;

    location /api {
        # Variable form forces re-resolution via Docker DNS — without it,
        # a literal `proxy_pass http://backend` caches the IP at config
        # load and returns 502 when the backend container restarts.
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
