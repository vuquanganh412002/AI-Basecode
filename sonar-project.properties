# === Project metadata ===
sonar.projectKey=agrinews
sonar.projectName=AgriNews
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# === Source vs Test split ===
# `sonar.sources` = production code; `sonar.tests` = test code.
# Sonar applies different rule sets and metrics to each.
sonar.sources=apps/backend/src,apps/frontend/src
sonar.tests=apps/backend/src,apps/frontend/src,apps/backend/test
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/__tests__/**

# === Exclusions: do NOT scan at all ===
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.min.js,\
  **/styles/tailwind.css,\
  **/api/generated/**,\
  **/swagger.json,\
  **/migrations/**,\
  **/.scannerwork/**

# === Coverage exclusions: scan but don't require coverage ===
# Mirrors apps/backend/jest.config.ts (collectCoverageFrom) and
# apps/frontend/vitest.config.ts (coverage.exclude). See
# .claude/rules/testing.md §Coverage excludes for the rationale.
sonar.coverage.exclusions=\
  apps/backend/src/main.ts,\
  apps/backend/src/**/*.module.ts,\
  apps/backend/src/database/entities/**,\
  apps/backend/src/database/data-source.ts,\
  apps/backend/src/**/dto/**/*.dto.ts,\
  apps/backend/src/**/*.constant.ts,\
  apps/frontend/src/main.ts,\
  apps/frontend/src/App.vue,\
  apps/frontend/src/router/index.ts,\
  apps/frontend/src/env.d.ts,\
  apps/frontend/src/types/**,\
  apps/frontend/src/**/*.d.ts

# === Coverage report paths ===
# Vitest writes lcov to apps/frontend/coverage/lcov.info.
# Backend Jest needs `--coverage` enabled to produce the matching file.
sonar.javascript.lcov.reportPaths=apps/frontend/coverage/lcov.info,apps/backend/coverage/lcov.info

# === TS-aware analysis ===
sonar.typescript.tsconfigPath=apps/frontend/tsconfig.json,apps/backend/tsconfig.json

# === Server connection ===
# `sonar.token` is intentionally NOT set here — sonar-scanner picks up
# the `SONAR_TOKEN` environment variable automatically. Set it locally:
#   export SONAR_TOKEN=squ_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# This lets the file be checked into git without leaking secrets.
sonar.host.url=http://localhost:9002

# === Rule suppressions (confirmed false positives / project convention) ===
# Each multicriteria entry needs a paired `ruleKey` + `resourceKey`.
sonar.issue.ignore.multicriteria=fp_supertest,fp_void_promise,fp_pwd_msg_var,fp_pwd_msg_var_loginid,fp_pwd_msg_var_reset,fp_doc_comments,fp_intentional_todo,fp_pgmem_skip
#
# S2699 ("Add at least one assertion") — supertest's `.expect(status)` IS
# an assertion (it throws on mismatch), but Sonar's TS plugin only counts
# `expect()` / `assert*()` calls. We rely on `.expect()` throughout
# controller specs + integration tests so this fires ~78 false positives.
sonar.issue.ignore.multicriteria.fp_supertest.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.fp_supertest.resourceKey=apps/backend/**/*.spec.ts
#
# S3735 ("Remove this use of the void operator") — `void fetchList()` is
# the project's canonical fire-and-forget pattern (see canonical list-view
# template in `.claude/rules/vue.md`). Suppressing inside FE views keeps
# the convention enforced by Sonar but allowed where we want it.
sonar.issue.ignore.multicriteria.fp_void_promise.ruleKey=typescript:S3735
sonar.issue.ignore.multicriteria.fp_void_promise.resourceKey=apps/frontend/src/views/**/*.vue
#
# S2068 ("hard-coded password") — matches identifiers containing "password".
# Our `PASSWORD_FORMAT_MSG` / `LOGIN_ID_FORMAT_MSG` etc. are Japanese-locale
# message-text constants for client-side validation, not secrets. The DTO
# regex on the BE side gates the actual format.
sonar.issue.ignore.multicriteria.fp_pwd_msg_var.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.fp_pwd_msg_var.resourceKey=apps/frontend/src/views/account/AccountFormView.vue
sonar.issue.ignore.multicriteria.fp_pwd_msg_var_loginid.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.fp_pwd_msg_var_loginid.resourceKey=apps/frontend/src/views/auth/LoginView.vue
sonar.issue.ignore.multicriteria.fp_pwd_msg_var_reset.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.fp_pwd_msg_var_reset.resourceKey=apps/frontend/src/views/auth/ResetPasswordView.vue
#
# AvoidCommentedOutCodeCheck — fires on doc comments that contain code-like
# fragments (`type="email"`, `:to="{ name }"`, antd prop hints). These
# explain WHY the surrounding template doesn't take the obvious-but-wrong
# path; deleting them would erase the rationale for project conventions
# the customer requested. Suppressing on Vue views where these patterns
# cluster (forms, login, list screens). Keep elsewhere — if real
# commented-out code shows up in `.ts` files it's still flagged.
sonar.issue.ignore.multicriteria.fp_doc_comments.ruleKey=Web:AvoidCommentedOutCodeCheck
sonar.issue.ignore.multicriteria.fp_doc_comments.resourceKey=apps/frontend/src/views/**/*.vue
#
# S1135 ("Complete the task associated to this TODO comment") — TODOs are
# the project convention for placeholder views and "later SCR で実装予定"
# markers (`.claude/rules/vue.md §Menu / Navigation`). They're intentionally
# grep-able landmarks, not "incomplete work to be done before merge". The
# router placeholder routes + the SCR-019 not-yet-implemented `代行入力`
# branch in hanbaiten.service.ts both rely on this pattern. Re-enable if
# the team later wants TODOs treated as gating items.
sonar.issue.ignore.multicriteria.fp_intentional_todo.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.fp_intentional_todo.resourceKey=**/*
#
# S1607 ("Remove this unit test or explain why it is ignored") — integration
# specs intentionally `it.skip(...)` cases whose SQL pg-mem cannot execute
# (window functions like ROW_NUMBER(), real-Postgres-only features). The skip
# reason is documented inline in each test title + `.claude/skills/gen-ut-backend`
# convention; the auth/permission/validation contracts ARE covered by the
# sibling controller unit specs. These run in nightly CI against real Postgres.
sonar.issue.ignore.multicriteria.fp_pgmem_skip.ruleKey=typescript:S1607
sonar.issue.ignore.multicriteria.fp_pgmem_skip.resourceKey=apps/backend/test/integration/**/*.spec.ts

# === CI gate (optional) ===
# Uncomment to fail the scanner if quality gate is not met.
# sonar.qualitygate.wait=true
