<!doctype html>

<html class="light" lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>2段階認証 | Admin System</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              display: ["Inter", "Noto Sans JP", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", "Noto Sans JP", sans-serif;
      }
      .mfa-input:focus {
        border-color: #137fec;
        box-shadow: 0 0 0 2px rgba(19, 127, 236, 0.1);
        outline: none;
      }

  <body

    <div class="flex-1 flex flex-col items-center justify-center px-4 py-12">
      <!-- Main Card Container -->
      <div

        <!-- Header Section -->
        <div class="px-8 pt-10 pb-6 text-center">
          <div

              enhanced_encryption

          </div>
          <h1
            class="text-2xl font-bold text-slate-900 dark:text-slate-100 mb-3"
          >
            2段階認証
          </h1>
          <p class="text-slate-500 dark:text-slate-400 text-sm leading-relaxed">
            セキュリティ保護のため、登録済みのデバイスに送信された6桁の認証コードを入力してください。
          </p>
        </div>
        <!-- MFA Form Section -->
        <div class="px-8 pb-10">
          <div class="flex justify-between gap-2 mb-8" id="otp-container">
            <input
              class="mfa-input w-12 h-14 text-center text-xl font-bold border-2 border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm"
              maxlength="1"
              type="text"
            />
            <input
              class="mfa-input w-12 h-14 text-center text-xl font-bold border-2 border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm"
              maxlength="1"
              type="text"
            />
            <input
              class="mfa-input w-12 h-14 text-center text-xl font-bold border-2 border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm"
              maxlength="1"
              type="text"
            />
            <input
              class="mfa-input w-12 h-14 text-center text-xl font-bold border-2 border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm"
              maxlength="1"
              type="text"
            />
            <input
              class="mfa-input w-12 h-14 text-center text-xl font-bold border-2 border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm"
              maxlength="1"
              type="text"
            />
            <input
              class="mfa-input w-12 h-14 text-center text-xl font-bold border-2 border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm"
              maxlength="1"
              type="text"
            />
          </div>
          <button
            class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-200 flex items-center justify-center gap-2 mb-6"
          >
            <span>認証</span>
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
          </button>
          <div class="space-y-4 text-center">
            <div class="flex flex-col gap-3">
              <a
                class="text-primary hover:underline text-sm font-medium flex items-center justify-center gap-1"
                href="#"
              >
                <span class="material-symbols-outlined text-base">refresh</span>
                コードを再送する
              </a>
            </div>
          </div>
        </div>
        <!-- Footer Meta -->
        <div
          class="bg-slate-50 dark:bg-slate-800/50 px-8 py-4 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center"

          <div class="flex items-center gap-2 text-xs text-slate-400">
            <span class="material-symbols-outlined text-xs">verified_user</span>
            <span>セキュア接続</span>
          </div>
          <div class="text-xs text-slate-400">ID: 2FA-9932-881</div>
        </div>
      </div>
      <!-- Back to Login -->
      <a
        class="mt-8 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 text-sm flex items-center gap-2"
        href="#"

        <span class="material-symbols-outlined text-base">arrow_back</span>

    <!-- Background Decoration -->
    <div

      <div
