<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>クラウド版購読者管理システム - ログイン</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1677ff", // Ant Design Primary Blue
              "primary-hover": "#4096ff",
              "bg-layout": "#f5f5f5",
              "border-base": "#d9d9d9",
              "text-main": "rgba(0, 0, 0, 0.88)",
              "text-secondary": "rgba(0, 0, 0, 0.45)",
            },
            fontFamily: {
              display: ["'Noto Sans JP'", "sans-serif"],
            },
            borderRadius: {
              ant: "6px",
            },
            boxShadow: {
              "ant-card":
                "0 1px 2px 0 rgba(0, 0, 0, 0.03), 0 1px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px 0 rgba(0, 0, 0, 0.02)",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply font-display text-text-main antialiased;
        }
      }
      .ant-input-wrapper {
        @apply flex items-center border border-border-base rounded-ant bg-white transition-all duration-300 focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20;
      }
      .material-symbols-outlined {
        font-size: 20px;
        color: rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body
    class="bg-bg-layout dark:bg-slate-950 min-h-screen flex flex-col transition-colors duration-200"
  >
    <div class="flex-grow flex items-center justify-center py-12 px-4">
      <div class="w-full max-w-[400px] space-y-8">
        <header class="text-center">
          <h1 class="text-2xl font-bold text-text-main dark:text-white mb-2">
            日本情報新聞
          </h1>
          <p class="text-text-secondary dark:text-slate-400 text-sm">
            クラウド版購読者管理システム
          </p>
        </header>
        <main
          class="bg-white dark:bg-slate-900 rounded-ant shadow-ant-card p-8 border border-gray-100 dark:border-slate-800"
        >
          <form class="space-y-6">
            <div class="space-y-1.5">
              <label
                class="text-sm font-medium text-text-main dark:text-slate-300"
                >ユーザーID</label
              >
              <div
                class="ant-input-wrapper px-3 py-2 dark:bg-slate-800 dark:border-slate-700"
              >
                <span class="material-symbols-outlined mr-2">person</span>
                <input
                  class="w-full border-none focus:ring-0 bg-transparent p-0 text-sm placeholder:text-text-secondary"
                  placeholder="IDを入力してください"
                  type="text"
                />
              </div>
            </div>
            <div class="space-y-1.5">
              <label
                class="text-sm font-medium text-text-main dark:text-slate-300"
                >パスワード</label
              >
              <div
                class="ant-input-wrapper px-3 py-2 dark:bg-slate-800 dark:border-slate-700"
              >
                <span class="material-symbols-outlined mr-2">lock</span>
                <input
                  class="w-full border-none focus:ring-0 bg-transparent p-0 text-sm placeholder:text-text-secondary"
                  placeholder="パスワードを入力してください"
                  type="password"
                />
              </div>
            </div>
            <button
              class="w-full bg-primary hover:bg-primary-hover text-white font-medium py-2.5 rounded-ant transition-colors shadow-sm active:opacity-90"
            >
              ログイン
            </button>
            <div
              class="text-xs text-center text-text-secondary dark:text-slate-500 leading-relaxed"
            >
              ログインすることで<a
                class="text-primary hover:text-primary-hover underline"
                href="#"
                >利用規約</a
              >に同意したものとみなされます。
            </div>
          </form>
        </main>
        <div class="space-y-4">
          <section
            class="bg-white dark:bg-slate-900 rounded-ant shadow-ant-card border border-gray-100 dark:border-slate-800 overflow-hidden"
          >
            <div
              class="px-4 py-3 border-b border-gray-50 dark:border-slate-800 bg-gray-50/50 dark:bg-slate-800/50"
            >
              <h2
                class="text-xs font-bold text-text-secondary dark:text-slate-300 uppercase tracking-wider flex items-center"
              >
                <span
                  class="material-symbols-outlined text-sm mr-1.5"
                  style="font-size: 16px"
                  >campaign</span
                >
                お知らせ
              </h2>
            </div>
            <div class="p-4 space-y-3">
              <div class="text-xs flex gap-3">
                <span class="text-text-secondary font-mono shrink-0"
                  >2024.05.15</span
                >
                <span class="text-text-main dark:text-slate-300"
                  >利用規約を改訂・公開しました。</span
                >
              </div>
              <div
                class="text-xs flex gap-3 pt-2 border-t border-gray-50 dark:border-slate-800"
              >
                <span class="text-text-secondary font-mono shrink-0"
                  >2024.04.01</span
                >
                <span class="text-text-main dark:text-slate-300"
                  >システムメンテナンスに伴う一時停止について。</span
                >
              </div>
            </div>
          </section>
          <section
            class="bg-white dark:bg-slate-900 rounded-ant shadow-ant-card border border-gray-100 dark:border-slate-800 p-4"
          >
            <div class="flex items-start gap-3">
              <div class="bg-blue-50 dark:bg-blue-900/30 p-2 rounded-full">
                <span
                  class="material-symbols-outlined text-primary"
                  style="font-size: 20px"
                  >headset_mic</span
                >
              </div>
              <div>
                <h3
                  class="text-xs font-bold text-text-main dark:text-slate-200"
                >
                  お問い合わせ先
                </h3>
                <p
                  class="text-[11px] text-text-secondary dark:text-slate-400 mb-1"
                >
                  日本情報新聞 協同事業局業務管理部
                </p>
                <div class="flex items-baseline gap-2">
                  <span
                    class="text-base font-bold text-text-main dark:text-white"
                    >03-6281-5808</span
                  >
                  <span
                    class="text-[10px] text-text-secondary dark:text-slate-500"
                    >（平日 9:30〜17:30）</span
                  >
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
    <footer class="py-8 text-center">
      <p class="text-[11px] text-text-secondary dark:text-slate-500">
        © 2026 Japan.
      </p>
    </footer>
    <div class="fixed bottom-6 right-6">
      <button
        class="w-10 h-10 flex items-center justify-center bg-white dark:bg-slate-800 text-text-secondary dark:text-slate-200 rounded-full shadow-lg border border-gray-200 dark:border-slate-700 hover:scale-105 transition-transform"
        onclick="document.documentElement.classList.toggle('dark')"
      >
        <span class="material-symbols-outlined">contrast</span>
      </button>
    </div>
  </body>
</html>
